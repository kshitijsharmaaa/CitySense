{% comment %}
Reusable Loading State / Skeleton Component
Usage:
  {% include "components/loading_state.html" with message="Analyzing issue report with AI..." %}
{% endcomment %}

<div class="cs-loading-state">
  <div class="spinner-border cs-spinner mb-3" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="text-muted-cs fw-medium mb-0">{{ message|default:"Processing data, please wait..." }}</p>
</div>
