{% load static %}
<nav class="navbar navbar-expand-lg cs-navbar sticky-top">
  <div class="container">
    <a class="cs-brand" href="{% url 'home' %}">
      <span class="cs-brand-icon">
        <i class="bi bi-shield-check"></i>
      </span>
      <span>City<span style="color: var(--cs-accent);">Sense</span></span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#citysenseNavbar" aria-controls="citysenseNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="citysenseNavbar">
      <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-lg-1">
        <li class="nav-item">
          <a class="nav-link cs-nav-link" href="{% url 'home' %}">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>
        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link cs-nav-link" href="{% url 'dashboard:index' %}">
              <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link cs-nav-link" href="{% url 'issues:list' %}">
              <i class="bi bi-list-task me-1"></i> My Reports
            </a>
          </li>
        {% endif %}
      </ul>

      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
        {% if request.user.is_authenticated %}
          <div class="d-flex align-items-center gap-2 me-2">
            <span class="badge bg-light text-dark border px-2.5 py-2">
              <i class="bi bi-person-circle text-primary me-1"></i>
              <strong>{{ request.user.name }}</strong>
            </span>
          </div>
          <a href="{% url 'issues:create' %}" class="btn btn-cs-primary btn-sm d-inline-flex align-items-center gap-1">
            <i class="bi bi-plus-circle"></i> Report Issue
          </a>
          <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-cs-outline btn-sm d-inline-flex align-items-center gap-1 text-danger border-danger-subtle">
              <i class="bi bi-box-arrow-right"></i> Log out
            </button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="btn btn-cs-outline btn-sm d-inline-flex align-items-center gap-1">
            <i class="bi bi-box-arrow-in-right"></i> Log in
          </a>
          <a href="{% url 'accounts:register' %}" class="btn btn-cs-primary btn-sm d-inline-flex align-items-center gap-1">
            <i class="bi bi-person-plus"></i> Register
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
